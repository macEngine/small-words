baseURL = 'https://macengine.github.io/small-words/'
locale = 'zh-CN'
title = '小词'
enableRobotsTXT = true
capitalizeListTitles = false
summaryLength = 40

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON = 站内搜索索引 /index.json

[taxonomies]
  tag = 'tags'

[privacy.youtube]
  privacyEnhanced = true           # 用 youtube-nocookie.com 嵌入

[params]
  subtitle = '从公开演讲里学单词'
  description = '从公开演讲里学单词：每词一页，附原句和官方视频时间戳。'
  mainSections = ['words']

