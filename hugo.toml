baseURL = 'https://macengine.github.io/small-words/'
languageCode = 'zh-cn'
title = '小词'
theme = 'PaperMod'
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 20

[minify]
  disableXML = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON 供 PaperMod 站内搜索用

[taxonomies]
  tag = 'tags'

[privacy.youtube]
  privacyEnhanced = true           # 用 youtube-nocookie.com 嵌入

[params]
  env = 'production'
  description = '从公开演讲里学单词：每词一页，附原句和视频时间戳。'
  defaultTheme = 'auto'
  mainSections = ['words']
  DateFormat = '2006-01-02'
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = false
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = '小词'
    Content = '从公开演讲里学单词。每个词一页：释义、原句出处、视频时间戳。先从乔布斯 2005 年斯坦福毕业演讲开始。'

  [params.fuseOpts]
    isCaseSensitive = false
    threshold = 0.4
    minMatchCharLength = 1
    keys = ['title', 'summary', 'content', 'tags']

[[menu.main]]
  identifier = 'words'
  name = '单词'
  url = '/words/'
  weight = 10
[[menu.main]]
  identifier = 'speeches'
  name = '演讲'
  url = '/speeches/'
  weight = 20
[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 30
[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 40
[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50
