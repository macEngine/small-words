{{ define "main" }}
{{ partial "entry.html" . }}
{{ if eq .Section "words" }}
<nav class="post-nav">
  {{ with .NextInSection }}<a class="prev" href="{{ .RelPermalink }}">« {{ .Params.word | default .Title }}</a>{{ end }}
  {{ with .PrevInSection }}<a class="next" href="{{ .RelPermalink }}">{{ .Params.word | default .Title }} »</a>{{ end }}
</nav>
{{ end }}
{{ end }}
