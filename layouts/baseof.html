<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
{{ partial "header.html" . }}
<div class="layout">
  <main class="main">
  {{ block "main" . }}{{ end }}
  </main>
  <aside class="sidebar">
  {{ partial "sidebar.html" . }}
  </aside>
</div>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
