<article class="entry">
  <h1 class="entry-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Params.gloss }} <small class="gloss">{{ . }}</small>{{ end }}</h1>
  <p class="entry-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time></p>
  <div class="entry-content">{{ .Content }}</div>
  <footer class="entry-footer">
    {{ with .GetTerms "tags" }} 标签：{{ range $i, $t := . }}{{ if $i }}、{{ end }}<a href="{{ $t.RelPermalink }}">{{ $t.Title }}</a>{{ end }}{{ end }}
  </footer>
</article>
